<form class="invoice-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <label for="invoiceNumber" i18n="@@invoiceForm.number">Invoice number</label>
    <input id="invoiceNumber" formControlName="invoiceNumber" />
  </div>

  <div class="grid-2">
    <div class="form-field">
      <label for="studentName" i18n="@@invoiceForm.student">Student name</label>
      <input id="studentName" formControlName="studentName" />
    </div>
    <div class="form-field">
      <label for="registrationNumber" i18n="@@invoiceForm.regNum">Registration #</label>
      <input id="registrationNumber" formControlName="registrationNumber" />
    </div>
  </div>

  <div class="form-field">
    <label for="description" i18n="@@invoiceForm.description">Description</label>
    <input id="description" formControlName="description" />
  </div>

  <div class="grid-2">
    <div class="form-field">
      <label for="amount" i18n="@@invoiceForm.amount">Amount</label>
      <input id="amount" type="number" formControlName="amount" min="0" step="0.01" />
    </div>
    <div class="form-field">
      <label for="currency" i18n="@@invoiceForm.currency">Currency</label>
      <select id="currency" formControlName="currency">
        <option value="EUR">EUR</option>
        <option value="USD">USD</option>
        <option value="XAF">XAF</option>
        <option value="CAD">CAD</option>
      </select>
    </div>
  </div>

  <div class="grid-2">
    <div class="form-field">
      <label for="issuedAt" i18n="@@invoiceForm.issuedAt">Issued at</label>
      <input id="issuedAt" type="date" formControlName="issuedAt" />
    </div>
    <div class="form-field">
      <label for="dueAt" i18n="@@invoiceForm.dueAt">Due at</label>
      <input id="dueAt" type="date" formControlName="dueAt" />
    </div>
  </div>

  <div class="form-field">
    <label for="status" i18n="@@invoiceForm.status">Status</label>
    <select id="status" formControlName="status">
      <option value="DRAFT" i18n="@@invoiceForm.status.draft">Draft</option>
      <option value="ISSUED" i18n="@@invoiceForm.status.issued">Issued</option>
      <option value="PARTIAL" i18n="@@invoiceForm.status.partial">Partial</option>
      <option value="PAID" i18n="@@invoiceForm.status.paid">Paid</option>
      <option value="OVERDUE" i18n="@@invoiceForm.status.overdue">Overdue</option>
      <option value="CANCELLED" i18n="@@invoiceForm.status.cancelled">Cancelled</option>
    </select>
  </div>

  <div class="invoice-form__actions">
    <button type="button" class="btn btn--ghost" (click)="cancel.emit()" i18n="@@common.cancel">Cancel</button>
    <button type="submit" class="btn btn--primary" [disabled]="form.invalid" i18n="@@common.save">Save</button>
  </div>
</form>
