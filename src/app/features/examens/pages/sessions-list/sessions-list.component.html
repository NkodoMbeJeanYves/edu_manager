<section class="exam-sessions">
  <header class="exam-sessions__header">
    <div>
      <h1 i18n="@@examens.title">Exam sessions</h1>
      <p class="exam-sessions__hint" i18n="@@examens.count">
        {{ store.visibleCount() }} of {{ store.total() }} sessions
      </p>
    </div>

    <div class="exam-sessions__actions">
      <input
        type="search"
        i18n-placeholder="@@examens.searchPlaceholder"
        placeholder="Search by label…"
        [value]="store.filter().search ?? ''"
        (input)="search($any($event.target).value)"
        class="exam-sessions__search" />
      <button class="btn btn--primary" (click)="openCreate()" i18n="@@examens.new">New session</button>
    </div>
  </header>

  @if (store.loading()) {
    <div class="exam-sessions__state" i18n="@@common.loading">Loading…</div>
  } @else if (store.error()) {
    <div class="exam-sessions__state exam-sessions__state--error">{{ store.error() }}</div>
  } @else {
    <app-exam-session-list
      [sessions]="store.filtered()"
      (edit)="openEdit($event)"
      (remove)="remove($event)" />
  }

  @if (drawerOpen()) {
    <div class="drawer">
      <div class="drawer__overlay" (click)="closeDrawer()"></div>
      <div class="drawer__panel">
        <div class="drawer__head">
          @if (editing()) {
            <h2 i18n="@@examens.editTitle">Edit session</h2>
          } @else {
            <h2 i18n="@@examens.newTitle">New session</h2>
          }
          <button class="btn btn--ghost" (click)="closeDrawer()" i18n="@@common.close">Close</button>
        </div>
        <app-exam-session-form
          [session]="editing()"
          (save)="save($event)"
          (cancel)="closeDrawer()" />
      </div>
    </div>
  }
</section>
