<form class="message-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <label for="fromName" i18n="@@messageForm.from">From</label>
    <input id="fromName" formControlName="fromName" />
  </div>

  <div class="form-field">
    <label for="toName" i18n="@@messageForm.to">To</label>
    <input id="toName" formControlName="toName" />
  </div>

  <div class="form-field">
    <label for="subject" i18n="@@messageForm.subject">Subject</label>
    <input id="subject" formControlName="subject" />
  </div>

  <div class="form-field">
    <label for="priority" i18n="@@messageForm.priority">Priority</label>
    <select id="priority" formControlName="priority">
      <option value="NORMAL" i18n="@@messageForm.priority.normal">Normal</option>
      <option value="HIGH" i18n="@@messageForm.priority.high">High</option>
    </select>
  </div>

  <div class="form-field">
    <label for="body" i18n="@@messageForm.body">Body</label>
    <textarea id="body" formControlName="body" rows="8"></textarea>
  </div>

  <div class="message-form__actions">
    <button type="button" class="btn btn--ghost" (click)="cancel.emit()" i18n="@@common.cancel">Cancel</button>
    <button type="submit" class="btn btn--primary" [disabled]="form.invalid" i18n="@@messageForm.send">Send</button>
  </div>
</form>
