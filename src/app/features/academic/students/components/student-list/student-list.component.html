<div class="student-list card">
  <table>
    <thead>
      <tr>
        <th class="photo" i18n="@@studentList.photo">Photo</th>
        <th i18n="@@studentList.regNum">Reg. #</th>
        <th i18n="@@studentList.name">Name</th>
        <th i18n="@@studentList.email">Email</th>
        <th i18n="@@studentList.level">Level</th>
        <th i18n="@@studentList.status">Status</th>
        <th class="actions" i18n="@@studentList.actions">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (s of students; track s.id) {
        <tr>
          <td class="photo">
            <app-profile-photo
              size="sm"
              [editable]="false"
              [photo]="s.photoUrl ?? null"
              [name]="s.firstName + ' ' + s.lastName" />
          </td>
          <td class="mono">{{ s.registrationNumber }}</td>
          <td>{{ s.firstName }} {{ s.lastName }}</td>
          <td>{{ s.email }}</td>
          <td><span class="chip chip--level">{{ s.level }}</span></td>
          <td><span class="chip" [attr.data-status]="s.status">{{ s.status }}</span></td>
          <td class="actions">
            <button class="btn btn--ghost" (click)="edit.emit(s)" i18n="@@common.edit">Edit</button>
            <button class="btn btn--danger" (click)="remove.emit(s)" i18n="@@common.delete">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="7" class="empty" i18n="@@studentList.empty">No students found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
