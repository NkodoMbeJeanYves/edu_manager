<section class="grades">
  <header class="grades__header">
    <div>
      <h1 i18n="@@grades.title">Grades</h1>
      <p class="grades__hint" i18n="@@grades.count">
        {{ store.pagination.total() }} evaluations
      </p>
    </div>

    <div class="grades__actions">
      <input
        type="search"
        i18n-placeholder="@@grades.searchPlaceholder"
        placeholder="Search by student, subject…"
        [value]="store.filter().search ?? ''"
        (input)="search($any($event.target).value)"
        class="grades__search" />
      <button class="btn btn--primary" (click)="openCreate()" i18n="@@grades.new">New grade</button>
    </div>
  </header>

  @if (store.loading()) {
    <div class="grades__state" i18n="@@common.loading">Loading…</div>
  } @else if (store.error()) {
    <div class="grades__state grades__state--error">{{ store.error() }}</div>
  } @else {
    <app-grade-list
      [grades]="store.items()"
      (edit)="openEdit($event)"
      (remove)="remove($event)" />

    @if (store.pagination.totalPages() > 1) {
      <app-paginator
        appearance="compact"
        [length]="store.pagination.total()"
        [pageSize]="store.pagination.size()"
        [pageIndex]="store.pagination.page() - 1"
        (pageChange)="onPageChange($event)" />
    }
  }

  @if (drawerOpen()) {
    <div class="drawer">
      <div class="drawer__overlay" (click)="closeDrawer()"></div>
      <div class="drawer__panel">
        <div class="drawer__head">
          @if (editing()) {
            <h2 i18n="@@grades.editTitle">Edit grade</h2>
          } @else {
            <h2 i18n="@@grades.newTitle">New grade</h2>
          }
          <button class="btn btn--ghost" (click)="closeDrawer()" i18n="@@common.close">Close</button>
        </div>
        <app-grade-form
          [grade]="editing()"
          (save)="save($event)"
          (cancel)="closeDrawer()" />
      </div>
    </div>
  }
</section>
