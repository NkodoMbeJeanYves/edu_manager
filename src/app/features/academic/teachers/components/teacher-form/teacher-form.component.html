<form class="teacher-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-field">
    <label for="staffNumber" i18n="@@teacherForm.staffNum">Staff #</label>
    <input id="staffNumber" formControlName="staffNumber" />
  </div>

  <div class="grid-2">
    <div class="form-field">
      <label for="firstName" i18n="@@teacherForm.firstName">First name</label>
      <input id="firstName" formControlName="firstName" />
    </div>

    <div class="form-field">
      <label for="lastName" i18n="@@teacherForm.lastName">Last name</label>
      <input id="lastName" formControlName="lastName" />
    </div>
  </div>

  <div class="form-field">
    <label for="email" i18n="@@teacherForm.email">Email</label>
    <input id="email" type="email" formControlName="email" />
  </div>

  <div class="form-field">
    <label for="phone" i18n="@@teacherForm.phone">Phone</label>
    <input id="phone" formControlName="phone" />
  </div>

  <div class="form-field">
    <label for="discipline" i18n="@@teacherForm.discipline">Discipline</label>
    <input id="discipline" formControlName="discipline" />
  </div>

  <div class="grid-2">
    <div class="form-field">
      <label for="contractType" i18n="@@teacherForm.contract">Contract</label>
      <select id="contractType" formControlName="contractType">
        <option value="PERMANENT" i18n="@@teacherForm.contract.permanent">Permanent</option>
        <option value="TEMPORARY" i18n="@@teacherForm.contract.temporary">Temporary</option>
        <option value="HOURLY" i18n="@@teacherForm.contract.hourly">Hourly</option>
        <option value="VISITING" i18n="@@teacherForm.contract.visiting">Visiting</option>
      </select>
    </div>

    <div class="form-field">
      <label for="status" i18n="@@teacherForm.status">Status</label>
      <select id="status" formControlName="status">
        <option value="ACTIVE" i18n="@@teacherForm.status.active">Active</option>
        <option value="INACTIVE" i18n="@@teacherForm.status.inactive">Inactive</option>
        <option value="SUSPENDED" i18n="@@teacherForm.status.suspended">Suspended</option>
        <option value="RETIRED" i18n="@@teacherForm.status.retired">Retired</option>
      </select>
    </div>
  </div>

  <div class="teacher-form__actions">
    <button type="button" class="btn btn--ghost" (click)="cancel.emit()" i18n="@@common.cancel">Cancel</button>
    <button type="submit" class="btn btn--primary" [disabled]="form.invalid" i18n="@@common.save">Save</button>
  </div>
</form>
