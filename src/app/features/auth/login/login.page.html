<div class="login">
  <form class="login__card card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login__title">EduManager</h1>
    <p class="login__subtitle" i18n="@@login.subtitle">Sign in to your account</p>

    <div class="form-field">
      <label for="tenantCode" i18n="@@login.tenantCode">Tenant Code</label>
      <input id="tenantCode" type="text" formControlName="tenantCode" placeholder="Enter your tenant code"
        i18n-placeholder="@@login.tenantCode.placeholder" />
    </div>

    <div class="form-field">
      <label for="username" i18n="@@login.username">Username</label>
      <input id="username" type="text" formControlName="username" placeholder="Enter your username"
        i18n-placeholder="@@login.username.placeholder" autocomplete="username" />
    </div>

    <div class="form-field">
      <label for="password" i18n="@@login.password">Password</label>
      <input id="password" type="password" formControlName="password" placeholder="Enter your password"
        i18n-placeholder="@@login.password.placeholder" autocomplete="current-password" />
    </div>

    @if (error(); as msg) {
      <div class="login__error">{{ msg }}</div>
    }

    <button class="btn btn--primary login__submit" type="submit" [disabled]="loading()">
      @if (loading()) {
        <ng-container i18n="@@login.submitting">Signing in…</ng-container>
      } @else {
        <ng-container i18n="@@login.submit">Sign in</ng-container>
      }
    </button>
  </form>
</div>
