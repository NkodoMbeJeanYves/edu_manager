<div class="login">
  <form class="login__card card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login__title">EduManager</h1>
    <p class="login__subtitle" i18n="@@login.subtitle">Sign in to your account</p>

    <div class="form-field">
      <label for="email" i18n="@@login.email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />
    </div>

    <div class="form-field">
      <label for="password" i18n="@@login.password">Password</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    </div>

    @if (error(); as msg) {
      <div class="login__error">{{ msg }}</div>
    }

    <button class="btn btn--primary login__submit" type="submit" [disabled]="loading()">
      @if (loading()) {
        <ng-container i18n="@@login.submitting">Signing in…</ng-container>
      } @else {
        <ng-container i18n="@@login.submit">Sign in</ng-container>
      }
    </button>
  </form>
</div>
